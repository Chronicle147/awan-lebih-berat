name: Render Stickman Video

on:
  push:
    paths:
      - '**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Stickman Kino engine
        run: |
          git clone https://github.com/dsauce/stickman-kino.git engine
          cd engine
          npm ci

      - name: Copy video project into engine
        run: |
          mkdir -p engine/videos/awan-lebih-berat
          # Copy all files except .github and engine folders
          rsync -av --exclude='.github' --exclude='engine' . engine/videos/awan-lebih-berat/

      - name: Setup Stickman Kino (Chrome, fonts)
        run: |
          cd engine
          npx stickman setup --no-tts

      - name: Render video (draft quality)
        run: |
          cd engine
          npx stickman build videos/awan-lebih-berat --quality draft

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: awan-lebih-berat
          path: engine/videos/awan-lebih-berat/renders/*.mp4
          retention-days: 7

      - name: Upload high-quality render (optional)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd engine
          npx stickman build videos/awan-lebih-berat --quality looks

      - name: Upload looks quality artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: awan-lebih-berat-looks
          path: engine/videos/awan-lebih-berat/renders/*.mp4
          retention-days: 7
